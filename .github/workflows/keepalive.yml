# Pings the database once a day so the free Supabase project isn't paused between fill-ups.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY (same values as in config.js).
name: Keep database awake
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          AUTH=""
          case "$KEY" in sb_*) ;; *) AUTH="Authorization: Bearer $KEY" ;; esac
          curl -fsS -X POST "$URL/rest/v1/rpc/fuel_ping" \
            -H "apikey: $KEY" ${AUTH:+-H "$AUTH"} -H "Content-Type: application/json" -d '{}'
